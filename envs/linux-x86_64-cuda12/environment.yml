# recaster-dfl runtime environment: linux-x86_64-cuda12
#
# Single source of truth for this platform's DFL/TensorFlow env. The
# exact, hash-pinned resolution lives next to this file in conda-lock.yml
# (generated from this spec; not committed yet, see CHANGES.md).
# Upstream's root environment.yml and requirements-*.txt are kept only as
# upstream history and are NOT used by Recaster.
#
# Forbidden in this env (must never be added): onnxruntime*, insightface,
# opencv-python-headless, torch. Recaster's ONNX stack lives in a separate
# interpreter.
name: recaster-dfl
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - numpy=1.26.4
  - pyqt=5.15.*        # XSegEditor / merger GUI (conda-forge build)
  - scipy
  - h5py               # mainscripts/Sorter.py
  - numexpr            # core/imagelib/color_transfer.py
  - scikit-image       # core/imagelib/estimate_sharpness.py (sort by blur)
  - pillow
  - colorama
  - tqdm
  - pyyaml             # models/ModelBase.py (module-level import)
  - jsonschema         # models/ModelBase.py (module-level import)
  - pip
  - pip:
      - tensorflow[and-cuda]==2.16.2   # pulls nvidia-cudnn-cu12 8.9.x
      - opencv-python==4.10.0.84       # non-headless (highgui for DFL windows)
      - ffmpeg-python                  # mainscripts/VideoEd.py
      - tf2onnx                        # DFM export (lazy import). Resolves to 1.17.0 (onnx 1.19.0,
                                       # protobuf 4.25.x) with TF 2.16.2 + numpy 1.26.4 (PyPI, py3.10)
      - tensorboardX                   # optional training logs (lazy import)
