# recaster-dfl runtime environment: macos-arm64-metal, conda side
#
# Single source of truth for this platform's DFL/TensorFlow env, in two
# parts that are built together (release.yml):
#   environment.yml -> conda-lock.yml     conda packages (exact builds, sha256)
#   requirements.in -> requirements.txt   PyPI packages (exact versions, hashes),
#                                         installed with pip --require-hashes --no-deps
# Regenerate both locks with envs/lock.sh after editing either spec.
# Upstream's root environment.yml and requirements-*.txt are kept only as
# upstream history and are NOT used by Recaster.
#
# Forbidden in this env (must never be added): onnxruntime*, insightface,
# opencv-python-headless, torch. Recaster's ONNX stack lives in a separate
# interpreter.
#
# NOTE: the tensorflow 2.16.2 + tensorflow-metal 1.2.0 pairing is verified
# only by the release CI smoke (CPU, probe, S3FD/2DFAN); see requirements.in.
name: recaster-dfl
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - numpy=1.26.4
  - pyqt=5.15.*        # XSegEditor / merger GUI (conda-forge build)
  - scipy
  - h5py               # mainscripts/Sorter.py
  - numexpr            # core/imagelib/color_transfer.py
  - scikit-image       # core/imagelib/estimate_sharpness.py (sort by blur)
  - pillow
  - colorama
  - tqdm
  - pyyaml             # models/ModelBase.py (module-level import)
  - jsonschema         # models/ModelBase.py (module-level import)
  - pip                # installs requirements.txt
